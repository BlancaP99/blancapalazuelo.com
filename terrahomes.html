<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TERRA HOMES – Project</title>

    <!-- PDF.js: permite mostrar todas las páginas del PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
            type="module"></script>

    <style>
        /* =====================================================
           1. FUENTES
        ===================================================== */

        @font-face {
            font-family: "Area Normal";
            src:
                url("/fonts/AreaNormal.woff2") format("woff2"),
                url("/fonts/AreaNormal.woff") format("woff");
        }

        @font-face {
            font-family: "Sweet Sans Pro";
            src:
                url("/fonts/SWEETSANSPROREGULAR.OTF") format("opentype");
        }

        @font-face {
            font-family: "Moglan Demo";
            src:
                url("/fonts/MOGLAN_DEMO.TTF") format("truetype");
        }

        /* =====================================================
           2. RESET
        ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                url("/images/fondo_intro_2.png")
                center / cover
                no-repeat
                fixed;

            color: #fff;
            font-family: "Area Normal", sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                url("/images/fondo_intro_2.png")
                center / cover
                no-repeat;

            z-index: -1;
            pointer-events: none;
            transform: translateZ(0);
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           3. MENÚ
        ===================================================== */

        nav {
            position: absolute;
            top: 2rem;
            left: 5%;

            display: flex;
            align-items: center;
            gap: 1.5rem;

            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;

            z-index: 100;
        }

        .nav-logo {
            display: block;
            height: 1.4rem;
            width: auto;
            cursor: pointer;
        }

        .nav-separator {
            width: 1px;
            height: 1.2rem;
            background: rgba(255, 255, 255, 0.5);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            transition: opacity 0.25s ease;
        }

        nav a:hover {
            opacity: 0.65;
        }

        .hamburger {
            display: none;
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            margin: 5px 0;
            background: #fff;
        }

        /* =====================================================
           4. CONTENEDOR PRINCIPAL
        ===================================================== */

        .wrapper {
            width: min(90rem, 100%);
            margin: 0 auto;
            padding: 11rem 1.5rem 6rem;

            display: flex;
            flex-direction: column;
            gap: 5rem;
        }

        /* =====================================================
           5. CABECERA
        ===================================================== */

        .project-header {
            text-align: center;
        }

        h1 {
            margin-bottom: 0.45rem;

            font-family: "Moglan Demo", "Area Normal", sans-serif;
            font-size: 1.55rem;
            font-weight: 200;
            letter-spacing: 0.1rem;
        }

        h2 {
            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
        }

        .filter-bar {
            max-width: 850px;
            margin: 2.2rem auto 0;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem 1.6rem;
        }

        .filter-btn {
            position: relative;

            padding: 0 0 0.3rem;
            border: 0;
            background: none;

            color: #fff;
            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.1rem;
            text-transform: uppercase;

            cursor: pointer;
            opacity: 0.65;
            transition:
                opacity 0.25s ease,
                color 0.25s ease;
        }

        .filter-btn::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;

            width: 0;
            height: 1px;
            background: #fff;

            transition: width 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            opacity: 1;
        }

        .filter-btn.active::after {
            width: 100%;
        }

        /* =====================================================
           6. BLOQUES FILTRABLES
        ===================================================== */

        .project-content {
            display: flex;
            flex-direction: column;
            gap: 7rem;
        }

        .filter-item {
            width: 100%;
            opacity: 1;
            transform: translateY(0);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .filter-item.is-hidden {
            display: none;
        }

        .section-heading {
            margin-bottom: 2.2rem;
            text-align: center;
        }

        .section-heading h3 {
            font-family: "Moglan Demo", "Area Normal", sans-serif;
            font-size: 1.2rem;
            font-weight: 200;
            letter-spacing: 0.09rem;
            text-transform: uppercase;
        }

        .section-heading p {
            max-width: 580px;
            margin: 0.65rem auto 0;

            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.72rem;
            line-height: 1.6;
            letter-spacing: 0.08rem;
            text-transform: uppercase;

            opacity: 0.7;
        }

        /* =====================================================
           7. GALERÍA DE LOGOS
        ===================================================== */

        .logo-gallery {
            width: min(960px, 100%);
            margin: 0 auto;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.25rem;
        }

        .logo-card {
            position: relative;
            min-height: 380px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            overflow: hidden;
        }

        .logo-card--dark {
            background: #382d28;
        }

        .logo-card--light {
            background: #f3efe8;
        }

        .logo-card img {
            display: block;
            width: min(58%, 320px);
            height: auto;
            object-fit: contain;

            transition: transform 0.5s ease;
        }

        .logo-card:hover img {
            transform: scale(1.025);
        }

        .logo-label {
            position: absolute;
            left: 1rem;
            bottom: 0.85rem;

            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.08rem;
            text-transform: uppercase;

            opacity: 0.65;
        }

        .logo-card--light .logo-label {
            color: #382d28;
        }

        /* =====================================================
           8. PRESENTACIÓN HORIZONTAL
        ===================================================== */

        .presentation-shell {
            position: relative;
            width: 100%;
        }

        .presentation-gallery {
            width: 100%;
            padding: 0 1rem 1.5rem;

            display: flex;
            align-items: flex-start;
            gap: 1.1rem;

            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x proximity;
            scrollbar-width: thin;
            scrollbar-color:
                rgba(255, 255, 255, 0.5)
                rgba(255, 255, 255, 0.1);
        }

        .presentation-gallery::-webkit-scrollbar {
            height: 5px;
        }

        .presentation-gallery::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
        }

        .presentation-gallery::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.55);
            border-radius: 100px;
        }

        .pdf-slide {
            position: relative;
            flex: 0 0 auto;

            width: min(70vw, 720px);
            min-width: 580px;

            border-radius: 8px;
            overflow: hidden;
            background: #fff;

            scroll-snap-align: start;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
        }

        .pdf-slide canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .slide-number {
            position: absolute;
            right: 0.7rem;
            bottom: 0.65rem;

            min-width: 1.6rem;
            padding: 0.25rem 0.35rem;
            border-radius: 100px;

            background: rgba(0, 0, 0, 0.55);
            color: #fff;

            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.58rem;
            line-height: 1;
            text-align: center;
        }

        .presentation-message {
            width: 100%;
            min-height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.1rem;
            text-align: center;
            text-transform: uppercase;

            opacity: 0.65;
        }

        .presentation-actions {
            margin-top: 1.3rem;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .document-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;

            padding-bottom: 0.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);

            color: #fff;
            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.1rem;
            text-decoration: none;
            text-transform: uppercase;

            transition:
                opacity 0.25s ease,
                border-color 0.25s ease;
        }

        .document-link:hover {
            opacity: 0.65;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .document-link svg {
            width: 0.75rem;
            height: 0.75rem;
            fill: currentColor;
            transform: rotate(30deg);
        }

        /* =====================================================
           9. PREVIEW DE LA WEB
        ===================================================== */

        .web-box {
            position: relative;

            width: 100%;
            max-width: 1200px;
            margin: 0 auto;

            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .scale-wrapper {
            width: 117.647%;
            height: 117.647%;

            transform: scale(0.85);
            transform-origin: top left;
        }

        .web-box iframe {
            display: block;

            width: 100%;
            height: 90vh;
            max-height: 1000px;

            border: 0;
            border-radius: 12px;
            background: #fff;
        }

        .full-link {
            position: absolute;
            top: 0.7rem;
            right: 0.9rem;
            z-index: 10;

            display: inline-flex;
            align-items: center;
            gap: 0.35rem;

            padding: 0.4rem 0.65rem;
            border-radius: 6px;

            background: rgba(0, 0, 0, 0.68);
            color: #fff;

            font-family: "Sweet Sans Pro", sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.05rem;
            text-decoration: none;
            text-transform: uppercase;

            backdrop-filter: blur(5px);
        }

        .full-link svg {
            width: 0.65rem;
            height: 0.65rem;
            fill: #fff;
            transform: rotate(30deg);
        }

        /* =====================================================
           10. FOOTER
        ===================================================== */

        .site-footer {
            width: 100%;
            padding: 4.5rem 0 3.2rem;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-lock {
            display: block;
            width: 72px;
            height: auto;
            object-fit: contain;
            opacity: 0.95;
        }

        /* =====================================================
           11. RESPONSIVE
        ===================================================== */

        @media (max-width: 768px) {
            nav {
                left: 0;
                right: 0;
                width: 100%;
                justify-content: center;
            }

            .nav-logo {
                margin: auto;
            }

            .nav-separator {
                display: none;
            }

            .hamburger {
                position: absolute;
                top: 2.5rem;
                left: 50%;

                display: block;
                width: 26px;
                height: 20px;

                transform: translateX(-50%);
                cursor: pointer;
                z-index: 101;
            }

            .nav-links {
                display: none;
            }

            .nav-links.active {
                position: fixed;
                inset: 0;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2rem;

                background: rgba(0, 0, 0, 0.94);
                font-family: "Moglan Demo", "Area Normal", sans-serif;
            }

            .wrapper {
                padding: 10.5rem 1rem 4rem;
                gap: 4rem;
            }

            .project-content {
                gap: 5.5rem;
            }

            h1 {
                font-size: 1.4rem;
            }

            h2 {
                font-size: 0.76rem;
                line-height: 1.5;
            }

            .filter-bar {
                max-width: 350px;
                gap: 0.9rem 1.2rem;
            }

            .filter-btn {
                font-size: 0.64rem;
            }

            .logo-gallery {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .logo-card {
                min-height: 280px;
                border-radius: 10px;
            }

            .logo-card img {
                width: min(62%, 270px);
            }

            .presentation-gallery {
                padding-right: 0.3rem;
                padding-left: 0.3rem;
                gap: 0.8rem;
            }

            .pdf-slide {
                width: 86vw;
                min-width: 86vw;
                border-radius: 6px;
            }

            .web-box {
                max-width: 380px;
                border-radius: 22px;
            }

            .scale-wrapper {
                width: 100%;
                height: 100%;
                transform: none;
            }

            .web-box iframe {
                height: 700px;
                border-radius: 22px;
            }

            .full-link {
                top: 0.8rem;
                right: 0.8rem;
            }

            .site-footer {
                padding: 3.2rem 0 2.4rem;
            }

            .footer-lock {
                width: 58px;
            }
        }

        @media (max-width: 480px) {
            .section-heading h3 {
                font-size: 1.05rem;
            }

            .section-heading p {
                font-size: 0.64rem;
            }

            .logo-card {
                min-height: 235px;
            }

            .pdf-slide {
                width: 88vw;
                min-width: 88vw;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script>
        /* =====================================================
           MENÚ MÓVIL
        ===================================================== */

        const hamburger = document.getElementById("hamburger");
        const navLinks = document.getElementById("navLinks");

        hamburger.addEventListener("click", () => {
            const isOpen = navLinks.classList.toggle("active");

            hamburger.setAttribute("aria-expanded", String(isOpen));
            hamburger.setAttribute(
                "aria-label",
                isOpen ? "Cerrar menú" : "Abrir menú"
            );
        });

        navLinks.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => {
                navLinks.classList.remove("active");
                hamburger.setAttribute("aria-expanded", "false");
                hamburger.setAttribute("aria-label", "Abrir menú");
            });
        });

        /* =====================================================
           FILTROS FUNCIONALES
        ===================================================== */

        const filterButtons = document.querySelectorAll(".filter-btn");
        const filterItems = document.querySelectorAll(".filter-item");

        filterButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const selectedFilter = button.dataset.filter;

                filterButtons.forEach((currentButton) => {
                    currentButton.classList.remove("active");
                });

                button.classList.add("active");

                filterItems.forEach((item) => {
                    const categories = item.dataset.categories
                        .split(" ")
                        .filter(Boolean);

                    const shouldShow =
                        selectedFilter === "all" ||
                        categories.includes(selectedFilter);

                    item.classList.toggle("is-hidden", !shouldShow);
                });
            });
        });
    </script>

    <!-- =====================================================
         PDF.JS: RENDERIZA TODAS LAS DIAPOSITIVAS
    ====================================================== -->

    <script type="module">
        import * as pdfjsLib from
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

        const pdfPath = "./REBRANDING_2026.pdf";
        const gallery = document.getElementById("presentationGallery");
        const message = document.getElementById("pdfMessage");

        async function renderPresentation() {
            try {
                const pdf = await pdfjsLib.getDocument(pdfPath).promise;

                if (message) {
                    message.remove();
                }

                for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    const page = await pdf.getPage(pageNumber);

                    /*
                     * Se renderiza a mayor resolución para que las páginas
                     * se vean nítidas, aunque visualmente se adapten con CSS.
                     */
                    const baseViewport = page.getViewport({ scale: 1 });
                    const targetWidth = 1500;
                    const renderScale = targetWidth / baseViewport.width;
                    const viewport = page.getViewport({ scale: renderScale });

                    const slide = document.createElement("figure");
                    slide.className = "pdf-slide";
                    slide.setAttribute(
                        "aria-label",
                        `Diapositiva ${pageNumber} de ${pdf.numPages}`
                    );

                    const canvas = document.createElement("canvas");
                    const context = canvas.getContext("2d", {
                        alpha: false
                    });

                    canvas.width = Math.ceil(viewport.width);
                    canvas.height = Math.ceil(viewport.height);

                    const number = document.createElement("figcaption");
                    number.className = "slide-number";
                    number.textContent = `${pageNumber} / ${pdf.numPages}`;

                    slide.appendChild(canvas);
                    slide.appendChild(number);
                    gallery.appendChild(slide);

                    await page.render({
                        canvasContext: context,
                        viewport
                    }).promise;
                }
            } catch (error) {
                console.error("No se pudo cargar la presentación:", error);

                gallery.innerHTML = `
                    <div class="presentation-message">
                        The presentation could not be displayed.
                        Please open the full PDF below.
                    </div>
                `;
            }
        }

        renderPresentation();
    </script>
